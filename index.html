<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4 text-gray-300">

  <div class="bg-gray-950 bg-opacity-90 rounded-xl shadow-lg max-w-5xl w-full p-6 flex flex-col gap-6"
       style="max-height: 90vh; overflow-y: auto;">

    <h1 class="text-3xl font-bold text-center text-white">🌦️ Weather App</h1>

    <!-- Fixed City Cards -->
    <div id="fixedCities" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 text-gray-300">
      <!-- Cards appended here -->
    </div>

    <!-- Search Section -->
    <div class="flex gap-3 items-center justify-center">
      <input id="cityInput" type="text" placeholder="Search city..." 
        class="p-2 rounded-md text-gray-900 flex-1 max-w-xs text-sm font-medium" />
      <button onclick="getWeather()" 
        class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-md font-semibold text-sm text-gray-300">Search</button>
    </div>

    <p id="errorMsg" class="text-red-500 font-medium text-center hidden mb-2"></p>

    <!-- Search Weather Result -->
    <div id="weatherResult" class="hidden text-center space-y-2 text-gray-300">

      <h2 id="cityName" class="text-xl font-semibold flex justify-center items-center gap-2 text-white">
        <span id="cityText">City</span> 🇮🇳
      </h2>

      <p id="description" class="capitalize font-medium text-md"></p>

      <div id="weatherIcon" class="text-4xl mx-auto">☁️</div>

      <div id="temperature" class="text-3xl font-bold text-white">-- °C</div>

      <div class="grid grid-cols-3 gap-2 mt-4">
        <div class="bg-gray-800 p-3 rounded-lg">
          <div class="text-xs text-gray-400">WINDSPEED</div>
          <div id="windSpeed" class="font-semibold text-sm">--</div>
        </div>
        <div class="bg-gray-800 p-3 rounded-lg">
          <div class="text-xs text-gray-400">HUMIDITY</div>
          <div id="humidity" class="font-semibold text-sm">--</div>
        </div>
        <div class="bg-gray-800 p-3 rounded-lg">
          <div class="text-xs text-gray-400">CLOUDS</div>
          <div id="clouds" class="font-semibold text-sm">--</div>
        </div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
